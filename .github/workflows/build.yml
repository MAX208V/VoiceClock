name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log

      - name: Publish logs to ci-report branch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/report
          for f in unit-tests.log assemble.log; do
            if [ -f "$f" ]; then
              grep -E "^(e:|w: .*(error|Error))|error:|FAILED|Execution failed|Caused by:|What went wrong|BUILD SUCCESSFUL|BUILD FAILED|Test .* (FAILED|PASSED)|Tests run|^> Task" "$f" > "/tmp/report/$f.summary" 2>/dev/null || true
              tail -n 400 "$f" > "/tmp/report/$f.tail" 2>/dev/null || true
            fi
          done
          cd /tmp/report
          echo "run=$GITHUB_RUN_ID tests=${{ steps.tests.outcome }} assemble=${{ steps.assemble.outcome }}" > STATUS.txt
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci report for $GITHUB_SHA" || true
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-report

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            unit-tests.log
            assemble.log
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: voiceclock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail if any step failed
        if: steps.tests.outcome != 'success' || steps.assemble.outcome != 'success'
        run: |
          echo "tests=${{ steps.tests.outcome }} assemble=${{ steps.assemble.outcome }}"
          exit 1
