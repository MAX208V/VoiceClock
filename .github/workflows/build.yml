name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Assemble debug APK
        id: assemble
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            unit-tests.log
            assemble.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: voiceclock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail if any step failed
        if: steps.tests.outcome != 'success' || steps.assemble.outcome != 'success'
        run: |
          echo '### 失败阶段' >> "$GITHUB_STEP_SUMMARY"
          echo "tests=${{ steps.tests.outcome }} assemble=${{ steps.assemble.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e:|error:|FAILED|Execution failed|Caused by|\\* What went wrong" -A 3 unit-tests.log assemble.log 2>/dev/null | head -120 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1
